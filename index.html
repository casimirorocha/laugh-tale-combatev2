    <script>
      // Suppress benign [vite] websocket connection warnings in AI Studio preview
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite] failed to connect to websocket') !== -1 || firstArg.indexOf('[vite] connecting...') !== -1)) {
            console.warn.apply(console, arguments);
            return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
